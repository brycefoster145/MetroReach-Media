<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="og-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <!-- Accent glow behind mark -->
    <radialGradient id="og-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <!-- Mark gradient -->
    <linearGradient id="og-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>
    <!-- Dot glow -->
    <radialGradient id="og-dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06D6A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Decorative geometric elements -->
  <line x1="0" y1="0" x2="300" y2="0" stroke="#3B82F6" stroke-width="1" opacity="0.15"/>
  <line x1="900" y1="630" x2="1200" y2="630" stroke="#06D6A0" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="0" x2="0" y2="200" stroke="#3B82F6" stroke-width="1" opacity="0.08"/>
  <line x1="1200" y1="430" x2="1200" y2="630" stroke="#06D6A0" stroke-width="1" opacity="0.08"/>

  <!-- Subtle grid dots -->
  <g opacity="0.04" fill="#F1F5F9">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="160" cy="60" r="2"/>
    <circle cx="60" cy="160" r="2"/>
    <circle cx="1040" cy="470" r="2"/>
    <circle cx="1140" cy="470" r="2"/>
    <circle cx="1040" cy="570" r="2"/>
    <circle cx="1140" cy="570" r="2"/>
  </g>

  <!-- Glow behind icon -->
  <ellipse cx="410" cy="300" rx="280" ry="200" fill="url(#og-glow)"/>

  <!-- Icon: scaled up 3x from the original mark (160x120 → 480x360) -->
  <g transform="translate(170, 135) scale(3)">
    <path d="M 0,120 L 0,0 L 44,0 L 80,62 L 116,0 L 160,0 L 160,120 Z" fill="url(#og-mark)"/>
    <circle cx="142" cy="112" r="8" fill="url(#og-dot-glow)"/>
    <circle cx="142" cy="112" r="4" fill="#06D6A0"/>
  </g>

  <!-- Wordmark -->
  <text x="670" y="285" font-family="Space Grotesk, system-ui, -apple-system, sans-serif" font-weight="700" font-size="64" letter-spacing="-0.02em">
    <tspan fill="#F1F5F9">Metro</tspan><tspan fill="#06D6A0">Reach</tspan>
  </text>

  <!-- Subtitle -->
  <text x="670" y="325" font-family="Space Grotesk, system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" letter-spacing="0.08em" fill="#64748B">
    PREMIUM SOCIAL MEDIA MARKETING
  </text>

  <!-- Bottom-right tagline -->
  <text x="670" y="380" font-family="Space Grotesk, system-ui, -apple-system, sans-serif" font-weight="400" font-size="16" fill="#475569" letter-spacing="0.02em">
    Agency-grade execution without the overhead
  </text>

  <!-- Bottom bar accent -->
  <rect x="670" y="400" width="80" height="3" rx="1.5" fill="#06D6A0" opacity="0.6"/>
</svg>
